<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>분실물 추적 탐정</title>
  
  <!-- Leaflet.js 지도 라이브러리 (무료 오픈소스, API키 불필요) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #f8fafc;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.125);
      width: 100%;
      max-width: 520px;
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      text-align: center;
      position: relative;
    }

    /* 화면 전환 모션 */
    .screen {
      display: none;
      opacity: 0;
      transform: translateY(20px) scale(0.98);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .screen.active {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #f1f5f9;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      color: #e2e8f0;
      font-size: 1rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-size: 1rem;
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
      background: rgba(15, 23, 42, 0.8);
    }

    /* 지도 관련 스타일 */
    .map-container {
      width: 100%;
      height: 220px;
      border-radius: 14px;
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 1;
    }

    .map-hint {
      font-size: 0.8rem;
      color: #38bdf8;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
      margin-top: 15px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.5);
    }

    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
      width: auto;
      margin: 0;
      background: #4f46e5;
    }

    /* 로딩 애니메이션 */
    .spinner-wrapper {
      width: 70px;
      height: 70px;
      margin: 20px auto 25px;
    }

    .spinner {
      width: 100%;
      height: 100%;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #818cf8;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f1f5f9;
      transition: opacity 0.3s ease;
    }

    /* 결과 스타일 */
    .rank-1 {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.25));
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
      text-align: left;
    }

    .rank-1-badge {
      font-size: 0.8rem;
      color: #a855f7;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .rank-1-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      margin: 6px 0;
    }

    .sub-ranks {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
      border-radius: 16px;
      text-align: left;
      margin-bottom: 20px;
    }

    .sub-rank-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .sub-rank-item:last-child {
      border-bottom: none;
    }

    .rank-info {
      flex: 1;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    /* 결과 지도 모달/카드 */
    #result-map-card {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="screen-start" class="screen active">
      <h1>분실물 추적 서비스</h1>
      <p>단서와 위치 지도를 활용하여<br>잃어버린 물건을 정밀 추적합니다.</p>
      <button class="btn" onclick="startTracking()">분실물 찾기 🕵️‍♂️</button>
    </div>

    <!-- 2. Step 1: 분실물 입력 -->
    <div id="screen-step1" class="screen">
      <div class="input-group">
        <label for="input-item">잃어버린 분실물</label>
        <input type="text" id="input-item" placeholder="예: 지갑, 에어팟, 차키">
      </div>
      <button class="btn" onclick="nextStep(1)">다음</button>
    </div>

    <!-- 3. Step 2: 행동 입력 -->
    <div id="screen-step2" class="screen">
      <div class="input-group">
        <label for="input-action">어떤 행동을 하다가 잃어버렸나요?</label>
        <input type="text" id="input-action" placeholder="예: 운동을 하다가, 카페에서 공부하다가">
      </div>
      <button class="btn" onclick="nextStep(2)">다음</button>
    </div>

    <!-- 4. Step 3: 마지막 장소 입력 + 지도 -->
    <div id="screen-step3" class="screen">
      <div class="input-group">
        <label for="input-last-place">마지막으로 갔던 장소</label>
        <input type="text" id="input-last-place" placeholder="직접 입력하거나 지도에서 클릭하세요">
        <div class="map-hint">📍 지도에서 위치를 직접 클릭하면 핀이 꽂힙니다.</div>
        <div id="map-step3" class="map-container"></div>
      </div>
      <button class="btn" onclick="nextStep(3)">다음</button>
    </div>

    <!-- 5. Step 4: 평소 들고 가던 장소 입력 + 지도 -->
    <div id="screen-step4" class="screen">
      <div class="input-group">
        <label id="label-usual-place" for="input-usual-place">평소에 어디에 들고 가나요?</label>
        <input type="text" id="input-usual-place" placeholder="직접 입력하거나 지도에서 클릭하세요">
        <div class="map-hint">📍 지도에서 위치를 클릭하여 핀을 설정하세요.</div>
        <div id="map-step4" class="map-container"></div>
      </div>
      <button class="btn" onclick="startAnalysis()">추적 시작</button>
    </div>

    <!-- 6. 로딩 화면 -->
    <div id="screen-loading" class="screen">
      <div class="spinner-wrapper">
        <div class="spinner"></div>
      </div>
      <div id="loading-text" class="loading-text">분실물 추적중..🔍</div>
    </div>

    <!-- 7. 결과 화면 (1, 2, 3등) -->
    <div id="screen-result" class="screen">
      <h2>분실물 예상 위치</h2>
      <p>단서와 위치 좌표를 분석한 결과입니다.</p>

      <div class="rank-1">
        <div class="rank-1-badge">🥇 최유력 후보 (1위)</div>
        <div id="rank-1-text" class="rank-1-title">-</div>
        <button class="btn btn-small" onclick="showResultMap(1)" style="margin-top: 5px;">🗺️ 지도 보기</button>
      </div>

      <div class="sub-ranks">
        <div class="sub-rank-item">
          <div class="rank-info" id="rank-2-text">🥈 2위: -</div>
          <button class="btn btn-small btn-secondary" onclick="showResultMap(2)">🗺️ 지도</button>
        </div>
        <div class="sub-rank-item">
          <div class="rank-info" id="rank-3-text">🥉 3위: -</div>
          <button class="btn btn-small btn-secondary" onclick="showResultMap(3)">🗺️ 지도</button>
        </div>
      </div>

      <!-- 결과 확인용 지도 박스 -->
      <div id="result-map-card">
        <div style="font-size:0.9rem; font-weight:bold; margin-bottom:8px; text-align:left;" id="result-map-title">📍 예상 위치 지도</div>
        <div id="map-result" class="map-container"></div>
      </div>

      <div class="button-group" style="margin-top: 15px;">
        <button class="btn btn-secondary" onclick="showMoreCandidates()">나머지 후보들</button>
        <button class="btn" onclick="resetAll()">처음으로 돌아가기</button>
      </div>
    </div>

    <!-- 8. 나머지 후보 화면 (4, 5등) -->
    <div id="screen-more" class="screen">
      <h2>나머지 예상 후보</h2>
      <p>추가적인 가능성이 있는 장소들입니다.</p>

      <div class="sub-ranks">
        <div class="sub-rank-item">
          <div class="rank-info" id="rank-4-text">4위: -</div>
          <button class="btn btn-small btn-secondary" onclick="showResultMap(4)">🗺️ 지도</button>
        </div>
        <div class="sub-rank-item">
          <div class="rank-info" id="rank-5-text">5위: -</div>
          <button class="btn btn-small btn-secondary" onclick="showResultMap(5)">🗺️ 지도</button>
        </div>
      </div>

      <button class="btn" onclick="resetAll()">처음으로 돌아가기</button>
    </div>

  </div>

  <script>
    const formData = {
      item: '',
      action: '',
      lastPlace: '',
      lastCoords: { lat: 37.5665, lng: 126.9780 }, // 기본 서울 시청
      usualPlace: '',
      usualCoords: { lat: 37.5665, lng: 126.9780 }
    };

    let map3, marker3;
    let map4, marker4;
    let resultMap, resultMarker;
    let candidatesData = [];

    function showScreen(screenId) {
      const currentActive = document.querySelector('.screen.active');
      const nextScreen = document.getElementById(screenId);

      if (currentActive) {
        currentActive.style.opacity = '0';
        currentActive.style.transform = 'translateY(-10px) scale(0.98)';
        
        setTimeout(() => {
          currentActive.classList.remove('active');
          currentActive.style.transform = '';
          
          nextScreen.classList.add('active');
          setTimeout(() => {
            nextScreen.style.opacity = '1';
            // 화면 전환 후 지도 사이즈 재조정
            if (screenId === 'screen-step3' && map3) map3.invalidateSize();
            if (screenId === 'screen-step4' && map4) map4.invalidateSize();
          }, 50);
        }, 300);
      } else {
        nextScreen.classList.add('active');
        setTimeout(() => {
          nextScreen.style.opacity = '1';
        }, 50);
      }
    }

    function startTracking() {
      showScreen('screen-step1');
    }

    function nextStep(currentStep) {
      if (currentStep === 1) {
        const item = document.getElementById('input-item').value.trim();
        if (!item) { alert('분실물을 입력해주세요!'); return; }
        formData.item = item;
        showScreen('screen-step2');
      } else if (currentStep === 2) {
        const action = document.getElementById('input-action').value.trim();
        if (!action) { alert('행동을 입력해주세요!'); return; }
        formData.action = action;
        showScreen('screen-step3');
        initMap3();
      } else if (currentStep === 3) {
        const lastPlace = document.getElementById('input-last-place').value.trim();
        if (!lastPlace) { alert('마지막으로 갔던 장소를 입력하거나 지도에 핀을 찍어주세요!'); return; }
        formData.lastPlace = lastPlace;
        
        document.getElementById('label-usual-place').innerText = 
          `평소에 ${formData.item}을(를) 어디에 들고 가나요?`;
        
        showScreen('screen-step4');
        initMap4();
      }
    }

    // 지도 초기화 (Step 3)
    function initMap3() {
      if (map3) return;
      map3 = L.map('map-step3').setView([37.5665, 126.9780], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map3);
      
      marker3 = L.marker([37.5665, 126.9780], { draggable: true }).addTo(map3);
      
      map3.on('click', function(e) {
        marker3.setLatLng(e.latlng);
        updateLocation3(e.latlng);
      });

      marker3.on('dragend', function(e) {
        updateLocation3(marker3.getLatLng());
      });
    }

    function updateLocation3(latlng) {
      formData.lastCoords = latlng;
      const placeText = `지정 위치 (위도: ${latlng.lat.toFixed(4)}, 경도: ${latlng.lng.toFixed(4)})`;
      document.getElementById('input-last-place').value = placeText;
    }

    // 지도 초기화 (Step 4)
    function initMap4() {
      if (map4) return;
      map4 = L.map('map-step4').setView([37.5665, 126.9780], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map4);
      
      marker4 = L.marker([37.5665, 126.9780], { draggable: true }).addTo(map4);
      
      map4.on('click', function(e) {
        marker4.setLatLng(e.latlng);
        updateLocation4(e.latlng);
      });

      marker4.on('dragend', function(e) {
        updateLocation4(marker4.getLatLng());
      });
    }

    function updateLocation4(latlng) {
      formData.usualCoords = latlng;
      const placeText = `지정 위치 (위도: ${latlng.lat.toFixed(4)}, 경도: ${latlng.lng.toFixed(4)})`;
      document.getElementById('input-usual-place').value = placeText;
    }

    function startAnalysis() {
      const usualPlace = document.getElementById('input-usual-place').value.trim();
      if (!usualPlace) { alert('장소를 입력하거나 지도에 핀을 찍어주세요!'); return; }
      formData.usualPlace = usualPlace;

      showScreen('screen-loading');
      const loadingText = document.getElementById('loading-text');
      loadingText.innerText = "분실물 추적중..🔍";

      setTimeout(() => {
        loadingText.style.opacity = '0';
        setTimeout(() => {
          loadingText.innerText = "후보 선정중..";
          loadingText.style.opacity = '1';
        }, 300);
      }, 2000);

      setTimeout(() => {
        calculateAndShowResults();
      }, 4000);
    }

    function calculateAndShowResults() {
      candidatesData = [
        { name: `${formData.lastPlace} 주변 동선`, score: 95, coords: formData.lastCoords },
        { name: `${formData.action} 장소 주변 반경 50m`, score: 88, coords: formData.lastCoords },
        { name: `평소 가던 ${formData.usualPlace}`, score: 75, coords: formData.usualCoords },
        { name: `이동 경로 상 대중교통 / 도로`, score: 60, coords: formData.lastCoords },
        { name: `집 안 보관 장소 (가방, 서랍 등)`, score: 45, coords: formData.usualCoords }
      ];

      candidatesData.sort((a, b) => b.score - a.score);

      document.getElementById('rank-1-text').innerText = `${candidatesData[0].name} (${candidatesData[0].score}점)`;
      document.getElementById('rank-2-text').innerHTML = `<span>🥈 2위: ${candidatesData[1].name}</span> <strong>${candidatesData[1].score}점</strong>`;
      document.getElementById('rank-3-text').innerHTML = `<span>🥉 3위: ${candidatesData[2].name}</span> <strong>${candidatesData[2].score}점</strong>`;
      
      document.getElementById('rank-4-text').innerHTML = `<span>4위: ${candidatesData[3].name}</span> <strong>${candidatesData[3].score}점</strong>`;
      document.getElementById('rank-5-text').innerHTML = `<span>5위: ${candidatesData[4].name}</span> <strong>${candidatesData[4].score}점</strong>`;

      showScreen('screen-result');
    }

    // 결과 지도 보기 기능
    function showResultMap(rankIndex) {
      const target = candidatesData[rankIndex - 1];
      const mapCard = document.getElementById('result-map-card');
      mapCard.style.display = 'block';

      document.getElementById('result-map-title').innerText = `📍 [${rankIndex}위] ${target.name} 지도 위치`;

      if (!resultMap) {
        resultMap = L.map('map-result').setView([target.coords.lat, target.coords.lng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(resultMap);
        resultMarker = L.marker([target.coords.lat, target.coords.lng]).addTo(resultMap);
      } else {
        resultMap.setView([target.coords.lat, target.coords.lng], 15);
        resultMarker.setLatLng([target.coords.lat, target.coords.lng]);
      }

      setTimeout(() => resultMap.invalidateSize(), 100);
    }

    function showMoreCandidates() {
      showScreen('screen-more');
    }

    function resetAll() {
      document.getElementById('input-item').value = '';
      document.getElementById('input-action').value = '';
      document.getElementById('input-last-place').value = '';
      document.getElementById('input-usual-place').value = '';
      document.getElementById('result-map-card').style.display = 'none';
      
      showScreen('screen-start');
    }
  </script>
</body>
</html>
