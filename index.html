<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>분실물 추적 탐정</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }

    /* 화면 전환 제어 */
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #333;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    /* 입력 폼 스타일 */
    .input-group {
      margin-bottom: 25px;
      text-align: left;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
      font-size: 1.05rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #e1e5ee;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #4a90e2;
    }

    /* 버튼 스타일 */
    .btn {
      width: 100%;
      padding: 15px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #357abd;
    }

    .btn-secondary {
      background-color: #7f8c8d;
    }

    .btn-secondary:hover {
      background-color: #626d6e;
    }

    /* 로딩 애니메이션 */
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #f3f3f3;
      border-top: 6px solid #4a90e2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
      margin-top: 15px;
    }

    /* 결과 스타일 */
    .rank-1 {
      background: #e8f4fe;
      border: 2px solid #4a90e2;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .rank-1-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: #1e5bb8;
      margin-top: 5px;
    }

    .sub-ranks {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 12px;
      text-align: left;
      margin-bottom: 20px;
    }

    .sub-rank-item {
      padding: 8px 0;
      border-bottom: 1px dashed #ddd;
      font-size: 1rem;
      color: #555;
    }

    .sub-rank-item:last-child {
      border-bottom: none;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="screen-start" class="screen active">
      <h1>분실물 추적 서비스</h1>
      <p>단서를 입력하고 잃어버린 물건을 찾아보세요!</p>
      <button class="btn" onclick="startTracking()">분실물 찾기 🕵️‍♂️</button>
    </div>

    <!-- 2. Step 1: 분실물 입력 -->
    <div id="screen-step1" class="screen">
      <div class="input-group">
        <label for="input-item">잃어버린 분실물</label>
        <input type="text" id="input-item" placeholder="예: 지갑, 에어팟, 차키">
      </div>
      <button class="btn" onclick="nextStep(1)">다음</button>
    </div>

    <!-- 3. Step 2: 행동 입력 -->
    <div id="screen-step2" class="screen">
      <div class="input-group">
        <label for="input-action">어떤 행동을 하다가 잃어버렸나요?</label>
        <input type="text" id="input-action" placeholder="예: 운동을 하다가, 카페에서 공부하다가">
      </div>
      <button class="btn" onclick="nextStep(2)">다음</button>
    </div>

    <!-- 4. Step 3: 마지막 장소 입력 -->
    <div id="screen-step3" class="screen">
      <div class="input-group">
        <label for="input-last-place">마지막으로 갔던 장소</label>
        <input type="text" id="input-last-place" placeholder="예: 도서관 2층, 버스정류장">
      </div>
      <button class="btn" onclick="nextStep(3)">다음</button>
    </div>

    <!-- 5. Step 4: 평소 들고 가던 장소 입력 -->
    <div id="screen-step4" class="screen">
      <div class="input-group">
        <label id="label-usual-place" for="input-usual-place">평소에 어디에 들고 가나요?</label>
        <input type="text" id="input-usual-place" placeholder="예: 학교, 회사, 가방 속">
      </div>
      <button class="btn" onclick="startAnalysis()">추적 시작</button>
    </div>

    <!-- 6. 로딩 화면 -->
    <div id="screen-loading" class="screen">
      <div class="spinner"></div>
      <div id="loading-text" class="loading-text">분실물 추적중..🔍</div>
    </div>

    <!-- 7. 결과 화면 (1, 2, 3등) -->
    <div id="screen-result" class="screen">
      <h2>분실물 예상 위치</h2>
      <p style="margin-bottom: 15px; font-size: 0.9rem;">입력한 단서를 바탕으로 분석한 결과입니다.</p>

      <div class="rank-1">
        <span>🥇 가장 확률이 높은 1위</span>
        <div id="rank-1-text" class="rank-1-title">-</div>
      </div>

      <div class="sub-ranks">
        <div class="sub-rank-item" id="rank-2-text">🥈 2위: -</div>
        <div class="sub-rank-item" id="rank-3-text">🥉 3위: -</div>
      </div>

      <div class="button-group">
        <button class="btn btn-secondary" onclick="showMoreCandidates()">나머지 후보들</button>
        <button class="btn" onclick="resetAll()">처음으로 돌아가기</button>
      </div>
    </div>

    <!-- 8. 나머지 후보 화면 (4, 5등) -->
    <div id="screen-more" class="screen">
      <h2>나머지 예상 후보</h2>
      <p style="margin-bottom: 15px; font-size: 0.9rem;">추가적인 가능성이 있는 장소들입니다.</p>

      <div class="sub-ranks">
        <div class="sub-rank-item" id="rank-4-text">4위: -</div>
        <div class="sub-rank-item" id="rank-5-text">5위: -</div>
      </div>

      <button class="btn" onclick="resetAll()">처음으로 돌아가기</button>
    </div>

  </div>

  <script>
    // 사용자 입력 데이터 저장 객체
    const formData = {
      item: '',
      action: '',
      lastPlace: '',
      usualPlace: ''
    };

    // 화면 전환 함수
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(screenId).classList.add('active');
    }

    // [시작] 분실물 찾기 버튼 클릭시
    function startTracking() {
      showScreen('screen-step1');
    }

    // Step 이동 처리
    function nextStep(currentStep) {
      if (currentStep === 1) {
        const item = document.getElementById('input-item').value.trim();
        if (!item) { alert('분실물을 입력해주세요!'); return; }
        formData.item = item;
        showScreen('screen-step2');
      } else if (currentStep === 2) {
        const action = document.getElementById('input-action').value.trim();
        if (!action) { alert('행동을 입력해주세요!'); return; }
        formData.action = action;
        showScreen('screen-step3');
      } else if (currentStep === 3) {
        const lastPlace = document.getElementById('input-last-place').value.trim();
        if (!lastPlace) { alert('마지막으로 갔던 장소를 입력해주세요!'); return; }
        formData.lastPlace = lastPlace;
        
        // 동적으로 4번째 질문 라벨 설정
        document.getElementById('label-usual-place').innerText = 
          `평소에 ${formData.item}을(를) 어디에 들고 가나요?`;
        
        showScreen('screen-step4');
      }
    }

    // 추적 및 점수 계산 시작
    function startAnalysis() {
      const usualPlace = document.getElementById('input-usual-place').value.trim();
      if (!usualPlace) { alert('장소를 입력해주세요!'); return; }
      formData.usualPlace = usualPlace;

      // 1. 로딩 화면 표시 및 1차 텍스트 설정
      showScreen('screen-loading');
      document.getElementById('loading-text').innerText = "분실물 추적중..🔍";

      // 2. 2초 후 "후보 선정중.."으로 텍스트 변경 (로딩 유지)
      setTimeout(() => {
        document.getElementById('loading-text').innerText = "후보 선정중..";
      }, 2000);

      // 3. 다시 2초 후 점수 산출 및 결과 화면 표시
      setTimeout(() => {
        calculateAndShowResults();
      }, 4000);
    }

    // 후보지 추적 및 점수 매기기 로직
    function calculateAndShowResults() {
      // 입력값을 조합하여 후보군 생성 및 점수 부여
      const candidates = [
        { name: `${formData.lastPlace} 근처 / 동선 내부`, score: 95 },
        { name: `${formData.action}을(를) 했던 정확한 위치`, score: 88 },
        { name: `평소 자주 가던 ${formData.usualPlace}`, score: 75 },
        { name: `이동 중에 이용한 대중교통 또는 길거리`, score: 60 },
        { name: `집 안 (가방 속, 외투 주머니, 책상 위 등)`, score: 45 }
      ];

      // 점수 높은 순으로 정렬 (1등 ~ 5등)
      candidates.sort((a, b) => b.score - a.score);

      // 화면에 데이터 출력
      document.getElementById('rank-1-text').innerText = `${candidates[0].name} (${candidates[0].score}점)`;
      document.getElementById('rank-2-text').innerText = `🥈 2위: ${candidates[1].name} (${candidates[1].score}점)`;
      document.getElementById('rank-3-text').innerText = `🥉 3위: ${candidates[2].name} (${candidates[2].score}점)`;
      
      document.getElementById('rank-4-text').innerText = `4위: ${candidates[3].name} (${candidates[3].score}점)`;
      document.getElementById('rank-5-text').innerText = `5위: ${candidates[4].name} (${candidates[4].score}점)`;

      // 결과 화면 표시
      showScreen('screen-result');
    }

    // 나머지 후보 보기
    function showMoreCandidates() {
      showScreen('screen-more');
    }

    // 처음으로 돌아가기 (초기화)
    function resetAll() {
      document.getElementById('input-item').value = '';
      document.getElementById('input-action').value = '';
      document.getElementById('input-last-place').value = '';
      document.getElementById('input-usual-place').value = '';
      
      formData.item = '';
      formData.action = '';
      formData.lastPlace = '';
      formData.usualPlace = '';

      showScreen('screen-start');
    }
  </script>
</body>
</html>
